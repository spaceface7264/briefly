name: Deploy to Cloudflare

# PR previews are handled by Cloudflare's native "Workers Builds"
# GitHub integration (see the `Workers Builds: rainbow` check on PRs).
# This workflow only runs for push to `main` and manual dispatches.
# Historical note: a custom `preview` job lived here that ran
# `opennextjs-cloudflare deploy --env preview` on every PR. It was
# removed because (1) it duplicated the native Cloudflare integration
# and (2) it had been silently failing for several PRs because
# `set -euo pipefail` halted at `OUT=$(...)` before the wrangler error
# message could be echoed, leaving CI red with no actionable log.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_env:
        description: "Deployment target environment"
        required: true
        default: production
        type: choice
        options:
          - production
          - staging

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_env || 'production' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Deploy with OpenNext
        run: |
          npx opennextjs-cloudflare build
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.target_env }}" = "staging" ]; then
            npx opennextjs-cloudflare deploy --env staging
          else
            npx opennextjs-cloudflare deploy --env ""
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
